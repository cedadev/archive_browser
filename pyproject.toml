[project]
name = "archive-browser"
version = "1.0.1"
description = "Directory browser for the CEDA Archive"
authors = [
    {name = "Sam Pepler",email = "sam.pepler@stfc.ac.uk"}
]
readme = "README.md"
requires-python = ">3.12,<4.0"
dependencies = [
    "django (>=6.1.3,<7.0.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "fbi-core @ git+https://github.com/cedadev/fbi-core.git",
    "django-flexi-settings @ git+https://github.com/cedadev/django-flexi-settings.git@0.2.0",
    "fwtheme-django @ git+https://github.com/cedadev/fwtheme-django.git@1.1.0",
    "fwtheme-django-ceda-serv @ git+https://github.com/cedadev/fwtheme-django-ceda-serv.git"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
